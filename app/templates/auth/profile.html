{% extends "base.html" %}

{% block title %}Profile - {{ user.username }}{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row">
        <div class="col-md-8 mx-auto">
            <div class="card">
                <div class="card-header">
                    <h4><i class="fas fa-user me-2"></i>User Profile</h4>
                </div>
                <div class="card-body">
                    <div class="row">
                        <div class="col-md-4 text-center">
                            <div class="mb-3">
                                <i class="fas fa-user-circle fa-5x text-muted"></i>
                            </div>
                        </div>
                        <div class="col-md-8">
                            <h5>{{ user.username }}</h5>
                            <p class="text-muted">Interior Design Enthusiast</p>
                            
                            <div class="mt-4">
                                <h6>Quick Actions</h6>
                                <div class="d-flex gap-2">
                                    <a href="{{ url_for('design.design_home') }}" class="btn btn-primary">
                                        <i class="fas fa-magic me-1"></i>Start Designing
                                    </a>
                                    <a href="{{ url_for('design.gallery') }}" class="btn btn-outline-secondary">
                                        <i class="fas fa-images me-1"></i>View Gallery
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
